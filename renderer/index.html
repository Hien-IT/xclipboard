<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XClipBoard</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="top-bar">
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search clipboard..." autocomplete="off">
      </div>
      
      <div class="filters">
        <button class="filter-btn active" data-type="all">All</button>
        <button class="filter-btn" data-type="text">Text</button>
        <button class="filter-btn" data-type="link">Links</button>
        <button class="filter-btn" data-type="image">Images</button>
        <button class="filter-btn" data-type="favorites">
          <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
          </svg>
        </button>
        <button id="clearBtn" class="clear-btn" title="Clear non-favorites">Clear</button>
      </div>
    </div>

    <div id="accessibilityBanner" class="accessibility-banner" style="display: none;">
      <div class="accessibility-content">
        <svg class="accessibility-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span class="accessibility-text">Accessibility permission required for auto-paste</span>
        <button id="accessibilityBtn" class="accessibility-btn">Grant Access</button>
      </div>
    </div>

    <div class="timeline-container">
      <div id="timeline" class="timeline">
        <!-- Cards will be injected here -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
